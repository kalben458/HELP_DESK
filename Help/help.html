<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit a New Maintenance Ticket</title>
  <link rel="stylesheet" href="help.css" />
</head>

<body>
  <div id="ticket-container">
    <header id="ticket-header">
      <span id="header-icon">🎓</span>
      <h1 id="header-title">Submit a New Maintenance Ticket</h1>
    </header>

<form id="ticket-form" novalidate>
      <h2 id="form-title">Submit a New Maintenance Ticket</h2>


      <div id="form-left">
        <label for="category" id="label-category">Category:</label>
        <select id="category" name="category" required>
          <option value="Electrical" selected>Electrical</option>
          <option value="Plumbing">Plumbing</option>
          <option value="HVAC">HVAC</option>
          <option value="Carpentry">Carpentry</option>
          <option value="Others">Others</option>
        </select>


        <label for="location" id="label-location">Location:</label>
        <input type="text" id="location"
        name="location"
        placeholder="Building, Room number"
         required />

        <label for="priority" id="label-priority">Priority:</label>
        <select id="priority" name="priority" required>
          <option value="High" selected>High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <label for="description" id="label-description">Description:</label>
        <textarea id="description" name="description" rows="4" placeholder="Describe your maintenance issue..." required></textarea>

        <label for="photo" id="label-photo" class="photo-label">
          📎 Attach a photo for evidence <span id="required-text">(required):</span>
        </label>
        <input type="file" id="photo" name="photo" accept="image/*" required />
      </div>

      <div id="form-right">
        <label id="right-description-label">Description:</label>
        <p id="right-description-text">
          Please describe the maintenance issue in the form to the left.
        </p>
        <img id="right-description-img" src="flickering_lights.jpg" alt="Maintenance evidence preview" />
      </div>

      <button type="submit" id="submit-btn">Submit Ticket</button>
    </form>
  </div>
  
  
  <script type="module" src="database.js"></script>
  
<script src="help.js"></script>

</body>
</html>
