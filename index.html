<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Limay Senior High School Help Desk</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="header">
        <div class="logo-section">
            <img src="./images/logo.png" alt="Limay Senior High School Logo" class="logo" />
            <div class="school-info">
                <h1 class="school-name">LIMAY SENIOR HIGH SCHOOL</h1>
                <p class="tagline">Leading Students To Holistic Success</p>
            </div>
        </div>
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="./adminPanel/admin.html">Admin</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Pages</a></li>
            
            </ul>
        </nav>
    </header>

    <main class="main-content">


        <div class="welcome-text">
            <p class="welcome-msg">WELCOME TO THE,</p>
            <h2 class="welcome-title">LIMAY SENIOR HIGH SCHOOL</h2>
            <button onclick="location.href='../Help/help.html'" class="help-desk-btn">
                <span class="icon">📝</span> Help Desk
            </button>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-logos">
            <div class="footer-logo-item">
                <img src="./images/deped.png" alt="Department of Education Logo" />
                <div class="footer-text">
                    <span class="dep-text">Department</span>
                    <span class="dep-text sub-text">Of Education</span>
                </div>
            </div>
            <div class="footer-logo-item center-logo">
                <img src="./images/logo.png" alt="Limay Logo" />
            </div>
            <div class="footer-logo-item">
                <img src="./images/bagongPilipinas.png" alt="Bagong Pilipinas Logo" />
                <span class="dep-text">Bagong Pilipinas</span>
            </div>
        </div>
    </footer>
</body>
</html>
